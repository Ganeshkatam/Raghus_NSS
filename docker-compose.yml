services:
  postgres:
    image: postgres:17-alpine
    container_name: nss-postgres
    environment:
      POSTGRES_DB: nss
      POSTGRES_USER: nss
      POSTGRES_PASSWORD: nss_dev_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nss -d nss"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: nss-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: nss-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nss
      SPRING_DATASOURCE_USERNAME: nss
      SPRING_DATASOURCE_PASSWORD: nss_dev_password_change_me
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
