plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'edu.college.nss'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    
    // Database & Migrations
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // JWT (JSON Web Token)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'postgres-concurrency', 'deployment'
    }
    exclude '**/deployment/**'
}

tasks.register('testPostgresConcurrency', Test) {
    description = 'Runs PostgreSQL ledger concurrency tests against an isolated PostgreSQL instance or Testcontainers.'
    group = 'verification'
    useJUnitPlatform {
        includeTags 'postgres-concurrency'
    }
}

tasks.register('verifyRemoteDatabase', JavaExec) {
    description = 'Executes read-only connectivity and constraint verification against the configured remote database.'
    group = 'deployment'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'edu.college.nss.deployment.LiveDatabaseDeploymentRunner'
    args = ['verify']
}

tasks.register('migrateRemoteDatabase', JavaExec) {
    description = 'Executes controlled Flyway migrations against the remote database. Requires CONFIRM_REMOTE_MIGRATION=true.'
    group = 'deployment'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'edu.college.nss.deployment.LiveDatabaseDeploymentRunner'
    args = ['migrate']
}
