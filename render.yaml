# Render Blueprint Specification for Raghu NSS Platform

services:
  - type: keyvalue
    name: nss-redis
    plan: free
    region: singapore

  - type: web
    name: api_nss
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        value: postgres.ywbcufyjfwjxvgifcasx
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_DATA_REDIS_HOST
        fromService:
          type: keyvalue
          name: nss-redis
          property: host
      - key: SPRING_DATA_REDIS_PORT
        fromService:
          type: keyvalue
          name: nss-redis
          property: port
      - key: JWT_SECRET
        generateValue: true
