# Render Blueprint Specification for Raghu NSS Platform

databases:
  - name: nss-postgres
    databaseName: nss
    user: nss_postgres_2bsb_user
    plan: free

services:
  - type: keyvalue
    name: nss-redis
    plan: free
    region: singapore

  - type: web
    name: api_nss
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: nss-postgres
          property: connectionString
      - key: SPRING_DATA_REDIS_HOST
        fromService:
          type: keyvalue
          name: nss-redis
          property: host
      - key: SPRING_DATA_REDIS_PORT
        fromService:
          type: keyvalue
          name: nss-redis
          property: port
      - key: JWT_SECRET
        generateValue: true
